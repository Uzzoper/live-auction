services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: liveauction-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SQL_SA_PASSWORD:-Dev_Password123}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data: